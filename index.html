<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manpower & Production Capacity Dashboard - Multi-Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #0b0f19; color: #e5e7eb; }
        .custom-card { background-color: #111827; border: 1px solid #1f2937; }
        .input-dark { background-color: #1f2937; border: 1px solid #374151; color: #ffffff; }
        .input-dark:focus { border-color: #3b82f6; outline: none; }
    </style>
</head>
<body class="min-h-screen p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center custom-card p-6 rounded-2xl shadow-xl">
            <div>
                <div class="flex items-center gap-2">
                    <span class="text-blue-500 text-xl font-bold">⚡</span>
                    <h1 class="text-xl font-bold text-white">Manpower Planning & Production Capacity</h1>
                </div>
                <p class="text-xs text-gray-400 mt-1">ระบบแดชบอร์ดสรุปยอดผลิตและตั้งค่ากระบวนการผลิต</p>
            </div>
            <div class="flex gap-2 text-sm items-center">
                <button onclick="switchMainView('dashboard')" id="nav-btn-dashboard" class="px-4 py-2 rounded-lg font-semibold text-xs transition bg-blue-600 text-white shadow">📊 หน้าหลัก (Dashboard)</button>
                <button onclick="switchMainView('setup')" id="nav-btn-setup" class="px-4 py-2 rounded-lg font-semibold text-xs transition bg-gray-800 text-gray-300 hover:text-white">⚙️ ตั้งค่ากระบวนการและรุ่น</button>
            </div>
        </header>

        <!-- Navigation Tabs for Lines -->
        <nav class="flex flex-wrap gap-2 custom-card p-3 rounded-xl">
            <button onclick="switchTab('press')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-gray-800 text-gray-400 hover:text-white" data-target="press">Press Machine</button>
            <button onclick="switchTab('back_bottom')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-blue-600 text-white shadow" data-target="back_bottom">Bottom plate #A (Line)</button>
            <button onclick="switchTab('door_a')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-gray-800 text-gray-400 hover:text-white" data-target="door_a">Door A</button>
            <button onclick="switchTab('door_b')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-gray-800 text-gray-400 hover:text-white" data-target="door_b">Door B</button>
            <button onclick="switchTab('door_c')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-gray-800 text-gray-400 hover:text-white" data-target="door_c">Door C</button>
        </nav>

        <!-- Main Dynamic App Container -->
        <div id="app-container"></div>

    </div>

    <script>
        const appState = {
            press: { name: "Press Machine", productGroup: "Press Panel", data: [], models: ["159C", "159F"], totalPlan: 1200, totalActual: 1250, hours: 8, cycle: 25, manpower: 4 },
            back_bottom: { 
                name: "Bottom plate #A — One Door", 
                productGroup: "Bottom Plate (One Door)",
                models: ["159C", "159F", "199C", "199F"],
                data: [
                    { station: "BTA01", p1: "ประกอบขา Leg เข้ากับชิ้นส่วน+เคาะ", p2: "ประกอบชิ้นส่วนด้านข้าง", p3: "", wt1: 13.90, wt2: 11.30, wt3: 0, loss: 3.21 },
                    { station: "BTA02", p1: "ประกอบขา Leg เข้ากับชิ้นส่วน+เคาะ", p2: "ประกอบชิ้นส่วนด้านข้าง", p3: "", wt1: 8.80, wt2: 10.20, wt3: 0, loss: 2.54 },
                    { station: "BTA03", p1: "ติดเทปเหนียวด้านข้าง 1 Pcs.", p2: "ติดเทปเหนียวด้านข้าง 1 Pcs.", p3: "ติดเทปเหนียวด้านข้าง 1 Pcs.", wt1: 5.90, wt2: 6.50, wt3: 3.80, loss: 0 },
                    { station: "BTA04", p1: "ติดเทปเหนียวด้านข้าง 1 Pcs.", p2: "ติดเทปเหนียวด้านข้าง 1 Pcs.", p3: "ติดเทปเหนียวด้านข้าง 1 Pcs.", wt1: 7.68, wt2: 4.25, wt3: 8.62, loss: 0 },
                    { station: "BTA05", p1: "ติดเทปด้านข้าง", p2: "", p3: "", wt1: 12.15, wt2: 0, wt3: 0, loss: 0 },
                    { station: "BTA06", p1: "ติดเทปเหนียวด้านข้าง 1 Pcs.", p2: "ติดเทปเหนียวด้านข้าง 1 Pcs.", p3: "ติดเทปปิดรู Suction", wt1: 9.60, wt2: 8.60, wt3: 18.40, loss: 0 },
                    { station: "BTA07", p1: "ติดเทปเหนียวด้านข้าง 1 Pcs.", p2: "ติดเทปเหนียวด้านข้าง 1 Pcs.", p3: "ติดเทปปิดรู Suction", wt1: 5.80, wt2: 10.10, wt3: 6.90, loss: 0 },
                    { station: "BTA08", p1: "ติด Seal 2 pcs.", p2: "", p3: "", wt1: 15.80, wt2: 0, wt3: 0, loss: 0 },
                    { station: "BTA09", p1: "", p2: "", p3: "", wt1: 16.10, wt2: 0, wt3: 0, loss: 5.77 }
                ],
                totalPlan: 2920, totalActual: 2935, hours: 8, manpower: 9
            },
            door_a: { name: "Door A", productGroup: "Refrigerator Door A", models: ["TD 469"], data: [], totalPlan: 800, totalActual: 800, hours: 8, cycle: 35, manpower: 5 },
            door_b: { name: "Door B", productGroup: "Refrigerator Door B", models: ["SBS 550"], data: [], totalPlan: 850, totalActual: 860, hours: 8, cycle: 34, manpower: 6 },
            door_c: { name: "Door C", productGroup: "Refrigerator Door C", models: ["BM23"], data: [], totalPlan: 750, totalActual: 730, hours: 8, cycle: 38, manpower: 5 }
        };

        let currentTab = 'back_bottom';
        let currentMainView = 'dashboard';

        function switchMainView(view) {
            currentMainView = view;
            if(view === 'dashboard') {
                document.getElementById('nav-btn-dashboard').className = "px-4 py-2 rounded-lg font-semibold text-xs transition bg-blue-600 text-white shadow";
                document.getElementById('nav-btn-setup').className = "px-4 py-2 rounded-lg font-semibold text-xs transition bg-gray-800 text-gray-300 hover:text-white";
            } else {
                document.getElementById('nav-btn-setup').className = "px-4 py-2 rounded-lg font-semibold text-xs transition bg-blue-600 text-white shadow";
                document.getElementById('nav-btn-dashboard').className = "px-4 py-2 rounded-lg font-semibold text-xs transition bg-gray-800 text-gray-300 hover:text-white";
            }
            renderView();
        }

        function switchTab(tabKey) {
            currentTab = tabKey;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if(btn.getAttribute('data-target') === tabKey) {
                    btn.className = "tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-blue-600 text-white shadow";
                } else {
                    btn.className = "tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-gray-800 text-gray-400 hover:text-white";
                }
            });
            renderView();
        }

        function renderView() {
            const state = appState[currentTab];
            const container = document.getElementById('app-container');

            let maxWt = 0;
            let sumWtAll = 0;
            state.data.forEach(item => {
                const total = (item.wt1 || 0) + (item.wt2 || 0) + (item.wt3 || 0) + (item.loss || 0);
                if(total > maxWt) maxWt = total;
                sumWtAll += total;
            });
            const stationsCount = state.data.length || 1;
            const takt = (stationsCount > 0 && maxWt > 0) ? maxWt.toFixed(2) : (state.cycle || "36.6");

            if(currentMainView === 'dashboard') {
                let modelBadgesSmall = '';
                if(state.models && state.models.length > 0) {
                    state.models.forEach(m => {
                        modelBadgesSmall += `<span class="bg-gray-800/80 text-yellow-400/90 border border-gray-700/60 px-2.5 py-1 rounded-md text-xs font-medium">${m}</span>`;
                    });
                } else {
                    modelBadgesSmall = `<span class="text-gray-500 text-xs">ยังไม่ได้เลือกรุ่น</span>`;
                }

                container.innerHTML = `
                    <div class="space-y-6">
                        <!-- Top Info Bar -->
                        <div class="custom-card p-6 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4 border-l-4 border-blue-500">
                            <div>
                                <span class="text-xs uppercase tracking-wider text-blue-400 font-semibold">Production Line Overview</span>
                                <h2 class="text-2xl font-bold text-white mt-1">${state.name}</h2>
                            </div>
                            <button onclick="switchMainView('setup')" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg text-xs font-semibold transition border border-gray-700 flex items-center gap-1.5">
                                <span>⚙️</span> ไปหน้าตั้งค่ากระบวนการ
                            </button>
                        </div>

                        <!-- Dashboard Minimal Cards -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <!-- Product Group & Models Combined Card -->
                            <div class="custom-card p-6 rounded-2xl space-y-4 flex flex-col justify-between">
                                <div>
                                    <p class="text-xs text-gray-400 font-medium">Product ใหญ่ (Product Group)</p>
                                    <div class="mt-2">
                                        <span class="bg-blue-950/80 text-blue-300 border border-blue-800 px-3.5 py-1.5 rounded-xl text-base font-bold inline-block shadow-inner">${state.productGroup || '-'}</span>
                                    </div>
                                </div>
                                <div class="pt-3 border-t border-gray-800/80 space-y-2">
                                    <p class="text-xs text-gray-400 font-medium">รุ่นที่ผลิต (Models)</p>
                                    <div class="flex flex-wrap gap-1.5">
                                        ${modelBadgesSmall}
                                    </div>
                                </div>
                            </div>

                            <!-- Cycle Time & Takt Time Card -->
                            <div class="custom-card p-6 rounded-2xl space-y-2">
                                <p class="text-xs text-gray-400 font-medium">เวลาการผลิต (Time Metrics)</p>
                                <div class="flex justify-between items-center pt-2">
                                    <span class="text-sm text-gray-300">Cycle Time (Max):</span>
                                    <span class="text-xl font-bold text-red-400">${maxWt > 0 ? maxWt.toFixed(2) : (state.cycle || 0)} s</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-sm text-gray-300">Takt Time:</span>
                                    <span class="text-xl font-bold text-yellow-400">${takt} s</span>
                                </div>
                            </div>

                            <!-- Manpower Card -->
                            <div class="custom-card p-6 rounded-2xl space-y-2 flex flex-col justify-between">
                                <p class="text-xs text-gray-400 font-medium">จำนวนพนักงาน (Manpower)</p>
                                <div class="flex items-baseline gap-2 pt-2">
                                    <span class="text-4xl font-bold text-blue-400">${state.manpower || stationsCount}</span>
                                    <span class="text-sm text-gray-400">คน (Stations: ${stationsCount})</span>
                                </div>
                                <p class="text-xs text-gray-500">อ้างอิงจากจำนวนสถานีหรือการตั้งค่ากำลังคน</p>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                let setupRows = '';
                state.data.forEach((item, index) => {
                    setupRows += `
                        <tr class="hover:bg-gray-800/40 transition">
                            <td class="p-3 font-semibold text-white"><input type="text" value="${item.station}" onchange="updateSetupRow(${index}, 'station', this.value)" class="input-dark px-2 py-1 rounded text-xs w-20"></td>
                            <td class="p-3"><input type="text" value="${item.p1 || ''}" onchange="updateSetupRow(${index}, 'p1', this.value)" class="input-dark px-2 py-1 rounded text-xs w-full"></td>
                            <td class="p-3"><input type="text" value="${item.p2 || ''}" onchange="updateSetupRow(${index}, 'p2', this.value)" class="input-dark px-2 py-1 rounded text-xs w-full"></td>
                            <td class="p-3"><input type="text" value="${item.p3 || ''}" onchange="updateSetupRow(${index}, 'p3', this.value)" class="input-dark px-2 py-1 rounded text-xs w-full"></td>
                            <td class="p-3 text-right"><input type="number" step="0.01" value="${item.wt1 || 0}" onchange="updateSetupRow(${index}, 'wt1', parseFloat(this.value))" class="input-dark px-2 py-1 rounded text-xs w-20 text-right"></td>
                            <td class="p-3 text-right"><input type="number" step="0.01" value="${item.wt2 || 0}" onchange="updateSetupRow(${index}, 'wt2', parseFloat(this.value))" class="input-dark px-2 py-1 rounded text-xs w-20 text-right"></td>
                            <td class="p-3 text-right"><input type="number" step="0.01" value="${item.wt3 || 0}" onchange="updateSetupRow(${index}, 'wt3', parseFloat(this.value))" class="input-dark px-2 py-1 rounded text-xs w-20 text-right"></td>
                            <td class="p-3 text-center"><button onclick="removeStation(${index})" class="bg-red-950 text-red-400 border border-red-800 px-2 py-1 rounded text-xs">ลบ</button></td>
                        </tr>
                    `;
                });

                const allModelsList = ["159C", "159F", "199C", "199F", "TM545#212", "FUF14 D", "FUF18 D", "TD 469", "SBS 550", "BM23"];
                let modelCheckboxes = '';
                allModelsList.forEach(m => {
                    const checked = state.models.includes(m) ? 'checked' : '';
                    modelCheckboxes += `
                        <label class="flex items-center gap-2 bg-gray-900 border border-gray-800 px-3 py-2 rounded-lg cursor-pointer text-xs">
                            <input type="checkbox" value="${m}" ${checked} onchange="toggleModel('${m}')" class="rounded bg-gray-800 border-gray-700 text-blue-600">
                            <span class="text-white">${m}</span>
                        </label>
                    `;
                });

                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="custom-card p-6 rounded-2xl flex flex-col md:flex-row justify-between items-center border-l-4 border-yellow-500 gap-4">
                            <div>
                                <span class="text-xs uppercase tracking-wider text-yellow-400 font-semibold">Setup & Configuration</span>
                                <h2 class="text-2xl font-bold text-white mt-1">ตั้งค่ากระบวนการและเลือกรุ่น สำหรับ ${state.name}</h2>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="addStation()" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2.5 rounded-lg text-xs font-semibold transition border border-gray-700">
                                    ➕ เพิ่มสถานี
                                </button>
                                <button onclick="switchMainView('dashboard')" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition shadow-md">
                                    💾 บันทึกและกลับหน้าหลัก
                                </button>
                            </div>
                        </div>

                        <!-- Product Group & Manpower Settings -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="custom-card p-6 rounded-xl space-y-2">
                                <h3 class="text-sm font-bold text-white">Product ใหญ่ (Product Group)</h3>
                                <p class="text-xs text-gray-400">ระบุชื่อผลิตภัณฑ์หลักของไลน์นี้</p>
                                <input type="text" value="${state.productGroup || ''}" onchange="updateProductGroup(this.value)" class="input-dark px-4 py-2 rounded-lg text-sm w-full font-semibold text-blue-400 mt-1" placeholder="เช่น Bottom Plate (One Door)">
                            </div>
                            <div class="custom-card p-6 rounded-xl space-y-2">
                                <h3 class="text-sm font-bold text-white">จำนวนพนักงาน (Manpower) ประจำไลน์</h3>
                                <p class="text-xs text-gray-400">กำหนดจำนวนคนทำงานรวมในไลน์ผลิตนี้</p>
                                <input type="number" value="${state.manpower || stationsCount}" onchange="updateManpower(this.value)" class="input-dark px-4 py-2 rounded-lg text-sm w-full font-bold text-blue-400 mt-1">
                            </div>
                        </div>

                        <!-- Model Selection Section -->
                        <div class="custom-card p-6 rounded-xl space-y-3">
                            <h3 class="text-sm font-bold text-white">เลือกรุ่น (Models) ที่ใช้ในกระบวนการนี้</h3>
                            <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                                ${modelCheckboxes}
                            </div>
                        </div>

                        <!-- Stations Table Editor -->
                        <div class="custom-card rounded-xl overflow-hidden shadow-xl">
                            <div class="p-6 border-b border-gray-800 flex justify-between items-center">
                                <h3 class="text-base font-bold text-white">ตารางจัดการสถานีและกระบวนการทำงาน</h3>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-gray-900/50 text-gray-400 text-xs border-b border-gray-800">
                                            <th class="p-3.5">Station</th>
                                            <th class="p-3.5">Process 1</th>
                                            <th class="p-3.5">Process 2</th>
                                            <th class="p-3.5">Process 3</th>
                                            <th class="p-3.5 text-right">WT 1 (s)</th>
                                            <th class="p-3.5 text-right">WT 2 (s)</th>
                                            <th class="p-3.5 text-right">WT 3 (s)</th>
                                            <th class="p-3.5 text-center">จัดการ</th>
                                        </tr>
                                    </thead>
                                    <tbody class="text-sm divide-y divide-gray-800/60">
                                        ${setupRows}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function updateSetupRow(index, field, value) {
            appState[currentTab].data[index][field] = value;
        }

        function updateManpower(val) {
            appState[currentTab].manpower = parseInt(val) || 1;
        }

        function updateProductGroup(val) {
            appState[currentTab].productGroup = val;
        }

        function addStation() {
            const stName = "ST0" + (appState[currentTab].data.length + 1);
            appState[currentTab].data.push({ station: stName, p1: "", p2: "", p3: "", wt1: 0, wt2: 0, wt3: 0, loss: 0 });
            renderView();
        }

        function removeStation(index) {
            appState[currentTab].data.splice(index, 1);
            renderView();
        }

        function toggleModel(modelName) {
            const models = appState[currentTab].models;
            const idx = models.indexOf(modelName);
            if(idx > -1) {
                models.splice(idx, 1);
            } else {
                models.push(modelName);
            }
        }

        window.onload = function() {
            switchTab('back_bottom');
        };
    </script>
</body>
</html>
