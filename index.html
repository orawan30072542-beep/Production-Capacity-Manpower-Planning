<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haier Door Line - Production Capacity & Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #e5e7eb; }
        .custom-card { background-color: #111827; border: 1px solid #1f2937; }
        .input-dark { background-color: #1f2937; border: 1px solid #374151; color: #ffffff; }
        .input-dark:focus { border-color: #3b82f6; outline: none; }
    </style>
</head>
<body class="min-h-screen p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header Top Bar -->
        <header class="flex flex-col md:flex-row justify-between items-center custom-card p-6 rounded-2xl shadow-xl">
            <div>
                <div class="flex items-center gap-2">
                    <span class="text-blue-500 text-xl font-bold">⚡</span>
                    <h1 class="text-xl font-bold text-white">Haier Door Line - Production Capacity & Line Balancing</h1>
                </div>
                <p class="text-xs text-gray-400 mt-1">ระบบบริหารจัดการกระบวนการผลิต, วิเคราะห์คอขวด (Bottleneck) และแดชบอร์ดสรุปภาพรวม</p>
            </div>
            <div class="flex gap-2 text-sm items-center mt-4 md:mt-0">
                <button id="btn-add-new-card" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow transition cursor-pointer flex items-center gap-1.5">
                    <span>➕</span> เพิ่มรายการพาร์ท/สถานีใหม่
                </button>
            </div>
        </header>

        <!-- DASHBOARD EXECUTIVE SUMMARY SECTION (รวมเข้ามาไว้ด้านบนสุดเพื่อให้เห็นภาพรวมทันที) -->
        <section id="executive-dashboard-summary" class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="custom-card p-5 rounded-xl border border-gray-800 flex flex-col justify-between">
                <span class="text-xs text-gray-400 font-medium">Target Takt Time</span>
                <div class="flex items-baseline gap-2 mt-2">
                    <span id="dash-takt" class="text-2xl font-bold text-white">20.0</span>
                    <span class="text-xs text-gray-400">Seconds</span>
                </div>
            </div>
            <div class="custom-card p-5 rounded-xl border border-gray-800 flex flex-col justify-between">
                <span class="text-xs text-gray-400 font-medium">Max Bottleneck Time</span>
                <div class="flex items-baseline gap-2 mt-2">
                    <span id="dash-bottleneck" class="text-2xl font-bold text-red-400">59.24</span>
                    <span class="text-xs text-gray-400">Seconds (BP05)</span>
                </div>
            </div>
            <div class="custom-card p-5 rounded-xl border border-gray-800 flex flex-col justify-between">
                <span class="text-xs text-gray-400 font-medium">Total Active Stations</span>
                <div class="flex items-baseline gap-2 mt-2">
                    <span id="dash-stations" class="text-2xl font-bold text-white">9</span>
                    <span class="text-xs text-gray-400">Stations</span>
                </div>
            </div>
            <div class="custom-card p-5 rounded-xl border border-gray-800 flex flex-col justify-between">
                <span class="text-xs text-gray-400 font-medium">Overall Line Balance Efficiency</span>
                <div class="flex items-baseline gap-2 mt-2">
                    <span id="dash-balance" class="text-2xl font-bold text-emerald-400">63%</span>
                    <span class="text-xs text-gray-400">Efficiency</span>
                </div>
            </div>
        </section>

        <!-- Filter Navigation Tabs (STATION / CATEGORIES) -->
        <nav class="flex flex-wrap items-center justify-between gap-4 custom-card p-4 rounded-xl">
            <div id="filter-tabs-container" class="flex flex-wrap items-center gap-2">
                <!-- Dynamically rendered filter buttons -->
            </div>
            <div class="relative w-full md:w-72">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">🔍</span>
                <input type="text" id="global-search" placeholder="Search process, model, or plan..." class="input-dark w-full pl-9 pr-4 py-1.5 rounded-lg text-xs">
            </div>
        </nav>

        <!-- Main Content Container (List of Production Cards / Setup Views) -->
        <div id="main-content-container" class="space-y-6">
            <!-- Rendered dynamically -->
        </div>

    </div>

    <script>
        // ข้อมูลหลักของระบบ (Back Plate #B และ Bottom Plate)
        let appData = [
            {
                id: "card_1",
                title: "Back Plate #B",
                partType: "Back plate",
                lineTag: "B line",
                customTags: ["Custom", "Edited"],
                models: ["T DOOR H Metal", "T DOOR H Metal WD", "T DOOR H Glass", "T DOOR H Glass WD"],
                takt: 20.0,
                stations: [
                    {
                        station: "BP01",
                        processes: [
                            { name: "ประกอบ Cover", wt: 12.56 },
                            { name: "ติด Injection Hold 1 PC.", wt: 7.72 }
                        ],
                        loss: 0
                    },
                    {
                        station: "BP02",
                        processes: [
                            { name: "ยึดสกรู Cover 2 PC.", wt: 8.96 },
                            { name: "ติด Injection Hold 1 PC.", wt: 7.46 }
                        ],
                        loss: 0
                    },
                    {
                        station: "BP03",
                        processes: [
                            { name: "ติดเทปใส Injection Hold 1 PC.", wt: 8.26 },
                            { name: "ติด Seal รูระบาย 5 PC", wt: 6.73 },
                            { name: "ติด Seal รูระบาย 3 PC", wt: 23.93 }
                        ],
                        loss: 0
                    },
                    {
                        station: "BP04",
                        processes: [
                            { name: "ติดเทปใส Injection Hold 1 PC.", wt: 4.57 },
                            { name: "ติด REINF 1 PC+ติด AL Tape", wt: 21.92 },
                            { name: "ติดเทปใส Cover BOX 3 PC", wt: 21.40 }
                        ],
                        loss: 0
                    },
                    {
                        station: "BP05",
                        processes: [
                            { name: "ติด Seal รูระบาย 2 PC", wt: 19.10 },
                            { name: "ติดเทปเหนียว Cover BOX 4 PC", wt: 40.14 }
                        ],
                        loss: 0
                    },
                    {
                        station: "BP06",
                        processes: [
                            { name: "วางท่อ Hot Line", wt: 16.75 },
                            { name: "ติดเทปล็อกท่อ 1 PC", wt: 9.12 }
                        ],
                        loss: 0
                    },
                    {
                        station: "BP07",
                        processes: [
                            { name: "ติด Seal ต่ำ 2 pcs.", wt: 13.76 },
                            { name: "ติดเทปล็อกท่อ 1 PC", wt: 9.12 },
                            { name: "ติด AL tape 3 PC", wt: 32.95 }
                        ],
                        loss: 0
                    },
                    {
                        station: "BP08",
                        processes: [
                            { name: "ติด AL tape 6 PC", wt: 57.51 }
                        ],
                        loss: 0
                    },
                    {
                        station: "BP09",
                        processes: [
                            { name: "ยก Back Plate ไปที่รถเข็น", wt: 15.23 }
                        ],
                        loss: 0
                    }
                ],
                isEditing: false
            }
        ];

        let activeFilter = 'All stations';
        let searchQuery = '';

        function renderApp() {
            renderDashboardSummary();
            renderFilters();
            renderContent();
        }

        function renderDashboardSummary() {
            // คำนวณค่าภาพรวมจาก Back Plate หลัก (หรือ Card แรกสุด)
            if(appData.length === 0) return;
            const primaryItem = appData[0];

            let totalStations = primaryItem.stations.length;
            let maxCycleTime = 0;
            let totalCycleSum = 0;
            let bottleneckName = "-";

            primaryItem.stations.forEach(s => {
                let sTime = s.processes.reduce((acc, curr) => acc + (Number(curr.wt) || 0), 0) + (Number(s.loss) || 0);
                totalCycleSum += sTime;
                if(sTime > maxCycleTime) {
                    maxCycleTime = sTime;
                    bottleneckName = s.station;
                }
            });

            let balance = (totalStations > 0 && maxCycleTime > 0) ? Math.round((totalCycleSum / (totalStations * maxCycleTime)) * 100) : 0;

            document.getElementById('dash-takt').innerText = primaryItem.takt.toFixed(1);
            document.getElementById('dash-bottleneck').innerText = maxCycleTime.toFixed(2);
            document.querySelector('#dash-bottleneck').parentElement.querySelector('.text-xs').innerText = `Seconds (${bottleneckName})`;
            document.getElementById('dash-stations').innerText = totalStations;
            document.getElementById('dash-balance').innerText = balance + '%';
        }

        function renderFilters() {
            const container = document.getElementById('filter-tabs-container');
            let totalStationsCount = 0;
            let backPlateCount = 0;
            let bottomPlateCount = 0;

            appData.forEach(item => {
                totalStationsCount += item.stations.length;
                if(item.partType.toLowerCase().includes('back')) backPlateCount += item.stations.length;
                if(item.partType.toLowerCase().includes('bottom')) bottomPlateCount += item.stations.length;
            });

            const filters = [
                { name: 'All stations', count: totalStationsCount },
                { name: 'Welding (5 machines)', count: 2 },
                { name: 'Back plate', count: backPlateCount },
                { name: 'Bottom plate', count: bottomPlateCount }
            ];

            let html = '';
            filters.forEach(f => {
                const isActive = (activeFilter === f.name);
                const btnClass = isActive 
                    ? "px-4 py-2 rounded-lg text-xs font-semibold bg-blue-600 text-white shadow flex items-center gap-1.5 cursor-pointer"
                    : "px-4 py-2 rounded-lg text-xs font-semibold bg-gray-900 text-gray-300 border border-gray-800 hover:bg-gray-800 flex items-center gap-1.5 cursor-pointer";
                html += `<button onclick="setFilter('${f.name}')" class="${btnClass}"><span>${f.name}</span> <span class="bg-black/30 px-2 py-0.5 rounded-full text-[10px]">${f.count}</span></button>`;
            });

            container.innerHTML = html;
        }

        function setFilter(filterName) {
            activeFilter = filterName;
            renderApp();
        }

        document.getElementById('global-search').addEventListener('input', function(e) {
            searchQuery = e.target.value.toLowerCase();
            renderContent();
        });

        function renderContent() {
            const container = document.getElementById('main-content-container');
            let html = '';

            let filteredData = appData.filter(item => {
                let matchFilter = true;
                if(activeFilter === 'Back plate' && !item.partType.toLowerCase().includes('back')) matchFilter = false;
                if(activeFilter === 'Bottom plate' && !item.partType.toLowerCase().includes('bottom')) matchFilter = false;
                
                let matchSearch = true;
                if(searchQuery) {
                    const matchTitle = item.title.toLowerCase().includes(searchQuery);
                    const matchModel = item.models.some(m => m.toLowerCase().includes(searchQuery));
                    const matchProcess = item.stations.some(s => s.processes.some(p => p.name.toLowerCase().includes(searchQuery)));
                    matchSearch = (matchTitle || matchModel || matchProcess);
                }

                return matchFilter && matchSearch;
            });

            if(filteredData.length === 0) {
                container.innerHTML = `<div class="custom-card p-12 text-center text-gray-500 rounded-xl text-sm">ไม่พบข้อมูลที่ตรงกับการค้นหา</div>`;
                return;
            }

            filteredData.forEach(item => {
                let totalStations = item.stations.length;
                let maxCycleTime = 0;
                let totalCycleSum = 0;

                item.stations.forEach(s => {
                    let sTime = s.processes.reduce((acc, curr) => acc + (Number(curr.wt) || 0), 0) + (Number(s.loss) || 0);
                    if(sTime > maxCycleTime) maxCycleTime = sTime;
                    totalCycleSum += sTime;
                });

                let balance = (totalStations > 0 && maxCycleTime > 0) ? Math.round((totalCycleSum / (totalStations * maxCycleTime)) * 100) : 0;

                if(item.isEditing) {
                    let stationEditorHtml = '';
                    item.stations.forEach((s, sIdx) => {
                        let sTime = s.processes.reduce((acc, curr) => acc + (Number(curr.wt) || 0), 0) + (Number(s.loss) || 0);
                        let processRowsHtml = '';
                        s.processes.forEach((p, pIdx) => {
                            processRowsHtml += `
                                <div class="flex items-center gap-3 bg-gray-900/60 p-2.5 rounded-lg border border-gray-800">
                                    <span class="text-xs text-gray-400 w-6">${pIdx + 1}.</span>
                                    <input type="text" value="${p.name}" oninput="updateProcessName('${item.id}', ${sIdx}, ${pIdx}, this.value)" class="input-dark px-3 py-1.5 rounded text-xs flex-1" placeholder="ชื่อกระบวนการทำงาน">
                                    <input type="number" step="0.01" value="${p.wt}" oninput="updateProcessWt('${item.id}', ${sIdx}, ${pIdx}, this.value)" class="input-dark px-3 py-1.5 rounded text-xs w-20 text-center font-bold text-white">
                                    <span class="text-xs text-gray-400">s</span>
                                    <button onclick="removeProcess('${item.id}', ${sIdx}, ${pIdx})" class="text-red-400 hover:text-red-300 text-xs px-2 py-1 cursor-pointer">✕</button>
                                </div>
                            `;
                        });

                        stationEditorHtml += `
                            <div class="custom-card p-4 rounded-xl space-y-3 border border-gray-800">
                                <div class="flex justify-between items-center">
                                    <div class="flex items-center gap-3">
                                        <input type="text" value="${s.station}" oninput="updateStationName('${item.id}', ${sIdx}, this.value)" class="input-dark px-3 py-1 rounded text-xs font-bold w-24 text-white">
                                        <span class="text-xs text-yellow-400 font-medium">Cycle ${sTime.toFixed(2)} s</span>
                                    </div>
                                    <button onclick="removeStation('${item.id}', ${sIdx})" class="text-red-400 hover:text-red-300 text-xs cursor-pointer">🗑️ ลบสถานี</button>
                                </div>
                                <div class="space-y-2 pl-2">
                                    ${processRowsHtml}
                                </div>
                                <div class="flex justify-between items-center pt-2">
                                    <button onclick="addProcess('${item.id}', ${sIdx})" class="bg-gray-800 hover:bg-gray-700 text-white px-3 py-1.5 rounded text-xs font-semibold transition border border-gray-700 cursor-pointer flex items-center gap-1">
                                        <span>➕</span> Add process
                                    </button>
                                    <div class="flex items-center gap-2">
                                        <span class="text-xs text-gray-400">Loss (s)</span>
                                        <input type="number" step="0.01" value="${s.loss || 0}" oninput="updateStationLoss('${item.id}', ${sIdx}, this.value)" class="input-dark px-2.5 py-1 rounded text-xs w-16 text-center">
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    let modelTagsEditHtml = '';
                    item.models.forEach((m, mIdx) => {
                        modelTagsEditHtml += `
                            <span class="bg-amber-950/60 text-amber-300 border border-amber-800/80 px-2.5 py-1 rounded-md text-xs font-medium flex items-center gap-1.5">
                                ${m} <button onclick="removeModel('${item.id}', ${mIdx})" class="text-amber-400 hover:text-white cursor-pointer font-bold">×</button>
                            </span>
                        `;
                    });

                    html += `
                        <div class="custom-card rounded-2xl p-6 space-y-6 shadow-2xl border-2 border-blue-600/50">
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-4 border-b border-gray-800">
                                <div class="flex items-center gap-3 flex-wrap">
                                    <input type="text" value="${item.title}" oninput="updateCardTitle('${item.id}', this.value)" class="input-dark px-3 py-1.5 rounded-lg text-sm font-bold text-white w-48">
                                    <select oninput="updatePartType('${item.id}', this.value)" class="input-dark px-3 py-1.5 rounded-lg text-xs text-blue-400 font-semibold">
                                        <option value="Back plate" ${item.partType === 'Back plate' ? 'selected' : ''}>Back plate</option>
                                        <option value="Bottom plate" ${item.partType === 'Bottom plate' ? 'selected' : ''}>Bottom plate</option>
                                    </select>
                                    <span class="bg-emerald-950 text-emerald-400 border border-emerald-800 px-2.5 py-1 rounded text-xs font-medium">${item.lineTag}</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <button onclick="cancelEdit('${item.id}')" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer">✕ Cancel</button>
                                    <button onclick="saveEdit('${item.id}')" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-lg text-xs font-semibold shadow cursor-pointer">💾 Save</button>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center justify-between gap-4 bg-gray-900/40 p-4 rounded-xl border border-gray-800">
                                <div class="flex flex-wrap items-center gap-2">
                                    ${modelTagsEditHtml}
                                    <div class="flex items-center gap-1">
                                        <input type="text" id="new_model_${item.id}" placeholder="Add model..." class="input-dark px-2.5 py-1 rounded text-xs w-32">
                                        <button onclick="addModel('${item.id}')" class="bg-gray-800 hover:bg-gray-700 text-white px-2.5 py-1 rounded text-xs font-semibold border border-gray-700 cursor-pointer">+ Add</button>
                                    </div>
                                </div>
                                <div class="flex items-center gap-4 text-xs">
                                    <div class="flex items-center gap-1.5">
                                        <span class="text-gray-400">Takt</span>
                                        <input type="number" value="${item.takt}" oninput="updateTakt('${item.id}', this.value)" class="input-dark px-2.5 py-1 rounded text-xs w-16 text-center font-bold text-white">
                                    </div>
                                    <span class="text-gray-400">Bottleneck <b class="text-red-400">${maxCycleTime.toFixed(2)} s</b></span>
                                    <span class="text-gray-400">Stations <b class="text-white">${totalStations}</b></span>
                                    <span class="text-gray-400">Balance <b class="text-emerald-400">${balance}%</b></span>
                                </div>
                            </div>

                            <div class="space-y-4">
                                ${stationEditorHtml}
                                <button onclick="addStation('${item.id}')" class="w-full py-3 bg-gray-900 hover:bg-gray-800 border border-dashed border-gray-700 rounded-xl text-xs font-semibold text-gray-300 transition cursor-pointer flex items-center justify-center gap-2">
                                    <span>➕</span> เพิ่มสถานีงานใหม่ (Add Station)
                                </button>
                            </div>
                        </div>
                    `;

                } else {
                    let modelBadgesHtml = '';
                    item.models.forEach(m => {
                        modelBadgesHtml += `<span class="bg-amber-950/60 text-amber-300 border border-amber-800/80 px-3 py-1 rounded-md text-xs font-medium">${m}</span>`;
                    });

                    let tableRowsHtml = '';
                    item.stations.forEach(s => {
                        let wt1 = s.processes[0] ? s.processes[0].wt : '-';
                        let wt2 = s.processes[1] ? s.processes[1].wt : '-';
                        let wt3 = s.processes[2] ? s.processes[2].wt : '-';
                        
                        let p1 = s.processes[0] ? s.processes[0].name : '-';
                        let p2 = s.processes[1] ? s.processes[1].name : '-';
                        let p3 = s.processes[2] ? s.processes[2].name : '-';

                        let wtTotal = (s.processes[0] ? Number(s.processes[0].wt)||0 : 0) + 
                                      (s.processes[1] ? Number(s.processes[1].wt)||0 : 0) + 
                                      (s.processes[2] ? Number(s.processes[2].wt)||0 : 0);
                        let lossVal = Number(s.loss) > 0 ? Number(s.loss).toFixed(2) : '-';
                        let cycleTime = wtTotal + (Number(s.loss)||0);
                        let isBottleneck = (cycleTime === maxCycleTime && maxCycleTime > 0);
                        let cycleClass = isBottleneck ? "text-red-400 font-bold" : "text-gray-200";

                        tableRowsHtml += `
                            <tr class="hover:bg-gray-800/40 transition border-b border-gray-800/60">
                                <td class="p-3 font-bold text-white">${s.station}</td>
                                <td class="p-3 text-gray-300">${p1}</td>
                                <td class="p-3 text-gray-300">${p2}</td>
                                <td class="p-3 text-gray-300">${p3}</td>
                                <td class="p-3 text-center text-gray-300">${wt1}</td>
                                <td class="p-3 text-center text-gray-300">${wt2}</td>
                                <td class="p-3 text-center text-gray-300">${wt3}</td>
                                <td class="p-3 text-center font-bold text-white">${wtTotal > 0 ? wtTotal.toFixed(2) : '-'}</td>
                                <td class="p-3 text-center text-gray-400">${lossVal}</td>
                                <td class="p-3 text-center ${cycleClass}">${cycleTime > 0 ? cycleTime.toFixed(2) : '-'}</td>
                            </tr>
                        `;
                    });

                    const partBadgeColor = item.partType.toLowerCase().includes('back') ? 'bg-red-950 text-red-300 border-red-800' : 'bg-emerald-950 text-emerald-300 border-emerald-800';

                    html += `
                        <div class="custom-card rounded-2xl overflow-hidden shadow-xl space-y-4">
                            <div class="p-6 pb-4 border-b border-gray-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div class="flex items-center gap-3 flex-wrap">
                                    <h3 class="text-lg font-bold text-white">${item.title}</h3>
                                    <span class="${partBadgeColor} border px-2.5 py-0.5 rounded text-xs font-semibold">${item.partType}</span>
                                    <span class="bg-emerald-950/80 text-emerald-400 border border-emerald-800 px-2.5 py-0.5 rounded text-xs font-semibold">${item.lineTag}</span>
                                    <span class="bg-gray-800 text-gray-300 px-2.5 py-0.5 rounded text-xs font-semibold">Custom</span>
                                    <span class="bg-blue-950 text-blue-300 border border-blue-800 px-2.5 py-0.5 rounded text-xs font-semibold">Edited</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <button onclick="toggleEdit('${item.id}')" class="bg-gray-800 hover:bg-gray-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold transition border border-gray-700 cursor-pointer flex items-center gap-1">
                                        <span>✏️</span> Edit
                                    </button>
                                    <button onclick="deleteCard('${item.id}')" class="bg-red-950/60 hover:bg-red-900 text-red-400 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition border border-red-800/60 cursor-pointer flex items-center gap-1">
                                        <span>🗑️</span> Delete
                                    </button>
                                </div>
                            </div>

                            <div class="px-6 flex flex-wrap items-center justify-between gap-4">
                                <div class="flex flex-wrap gap-2">${modelBadgesHtml}</div>
                                <div class="flex items-center gap-6 text-xs">
                                    <div>Takt <b class="text-white ml-1">${item.takt} s</b></div>
                                    <div>Bottleneck <b class="text-red-400 ml-1">${maxCycleTime.toFixed(2)} s</b></div>
                                    <div>Stations <b class="text-white ml-1">${totalStations}</b></div>
                                    <div>Balance <b class="text-emerald-400 ml-1">${balance}%</b></div>
                                </div>
                            </div>

                            <div class="overflow-x-auto px-2 pb-2">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-gray-900/60 text-gray-400 text-xs border-b border-gray-800">
                                            <th class="p-3">Station</th>
                                            <th class="p-3">Process 1</th>
                                            <th class="p-3">Process 2</th>
                                            <th class="p-3">Process 3</th>
                                            <th class="p-3 text-center">WT 1</th>
                                            <th class="p-3 text-center">WT 2</th>
                                            <th class="p-3 text-center">WT 3</th>
                                            <th class="p-3 text-center">WT Total</th>
                                            <th class="p-3 text-center">Loss</th>
                                            <th class="p-3 text-center">Cycle Time</th>
                                        </tr>
                                    </thead>
                                    <tbody class="text-sm divide-y divide-gray-800/60">
                                        ${tableRowsHtml}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                }
            });

            container.innerHTML = html;
        }

        function toggleEdit(id) { const item = appData.find(d => d.id === id); if(item) { item.isEditing = true; renderApp(); } }
        function cancelEdit(id) { const item = appData.find(d => d.id === id); if(item) { item.isEditing = false; renderApp(); } }
        function saveEdit(id) { const item = appData.find(d => d.id === id); if(item) { item.isEditing = false; renderApp(); } }
        function deleteCard(id) {
            if(confirm("คุณต้องการลบรายการพาร์ทนี้ใช่หรือไม่?")) {
                appData = appData.filter(d => d.id !== id);
                renderApp();
            }
        }
        function addNewCard() {
            const newId = 'card_' + Date.now();
            appData.unshift({
                id: newId,
                title: "New Part Item",
                partType: "Back plate",
                lineTag: "B line",
                customTags: ["Custom"],
                models: ["T DOOR H Metal"],
                takt: 20.0,
                stations: [
                    { station: "ST01", processes: [{ name: "กระบวนการที่ 1", wt: 10.0 }], loss: 0 }
                ],
                isEditing: true
            });
            renderApp();
        }
        document.getElementById('btn-add-new-card').addEventListener('click', addNewCard);

        function updateCardTitle(id, val) { const d = appData.find(x => x.id === id); if(d) d.title = val; }
        function updatePartType(id, val) { const d = appData.find(x => x.id === id); if(d) d.partType = val; }
        function updateTakt(id, val) { const d = appData.find(x => x.id === id); if(d) { d.takt = parseFloat(val) || 0; renderDashboardSummary(); } }

        function addModel(id) {
            const input = document.getElementById(`new_model_${id}`);
            if(input && input.value.trim() !== "") {
                const d = appData.find(x => x.id === id);
                if(d) { d.models.push(input.value.trim()); renderApp(); }
            }
        }
        function removeModel(id, mIdx) { const d = appData.find(x => x.id === id); if(d) { d.models.splice(mIdx, 1); renderApp(); } }

        function updateStationName(id, sIdx, val) { appData.find(x => x.id === id).stations[sIdx].station = val; }
        function updateStationLoss(id, sIdx, val) { appData.find(x => x.id === id).stations[sIdx].loss = parseFloat(val) || 0; renderDashboardSummary(); }
        function removeStation(id, sIdx) {
            const d = appData.find(x => x.id === id);
            if(d) { d.stations.splice(sIdx, 1); renderApp(); }
        }
        function addStation(id) {
            const d = appData.find(x => x.id === id);
            if(d) {
                const sName = "ST0" + (d.stations.length + 1);
                d.stations.push({ station: sName, processes: [{ name: "กระบวนการใหม่", wt: 10.0 }], loss: 0 });
                renderApp();
            }
        }

        function updateProcessName(id, sIdx, pIdx, val) { appData.find(x => x.id === id).stations[sIdx].processes[pIdx].name = val; }
        function updateProcessWt(id, sIdx, pIdx, val) { 
            appData.find(x => x.id === id).stations[sIdx].processes[pIdx].wt = parseFloat(val) || 0; 
            renderDashboardSummary();
        }
        function removeProcess(id, sIdx, pIdx) {
            const d = appData.find(x => x.id === id);
            if(d) { d.stations[sIdx].processes.splice(pIdx, 1); renderApp(); }
        }
        function addProcess(id, sIdx) {
            const d = appData.find(x => x.id === id);
            if(d) { d.stations[sIdx].processes.push({ name: "กระบวนการใหม่", wt: 5.0 }); renderApp(); }
        }

        window.onload = renderApp;
    </script>
</body>
</html>
