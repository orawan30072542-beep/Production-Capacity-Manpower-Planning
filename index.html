<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manpower & Production Capacity Dashboard - Multi-Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #0b0f19; color: #e5e7eb; }
        .custom-card { background-color: #111827; border: 1px solid #1f2937; }
        .input-dark { background-color: #1f2937; border: 1px solid #374151; color: #ffffff; }
        .input-dark:focus { border-color: #3b82f6; outline: none; }
    </style>
</head>
<body class="min-h-screen p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center custom-card p-6 rounded-2xl shadow-xl">
            <div>
                <div class="flex items-center gap-2">
                    <span class="text-blue-500 text-xl font-bold">⚡</span>
                    <h1 class="text-xl font-bold text-white">Manpower Planning & Production Capacity</h1>
                </div>
                <p class="text-xs text-gray-400 mt-1">ระบบคำนวณและติดตามยอดผลิตรายชั่วโมงจากไฟล์ Excel</p>
            </div>
            <div class="flex gap-3 text-sm items-center">
                <span class="text-xs bg-blue-950 text-blue-400 border border-blue-800 px-3 py-1.5 rounded-lg">🟢 ระบบรองรับอัปโหลด Excel แยกตามไลน์</span>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="flex flex-wrap gap-2 custom-card p-3 rounded-xl">
            <button onclick="switchTab('press')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-gray-800 text-gray-400 hover:text-white" data-target="press">Press Machine</button>
            <button onclick="switchTab('back_bottom')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-blue-600 text-white shadow" data-target="back_bottom">Back & Bottom Plate</button>
            <button onclick="switchTab('door_a')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-gray-800 text-gray-400 hover:text-white" data-target="door_a">Door A</button>
            <button onclick="switchTab('door_b')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-gray-800 text-gray-400 hover:text-white" data-target="door_b">Door B</button>
            <button onclick="switchTab('door_c')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-gray-800 text-gray-400 hover:text-white" data-target="door_c">Door C</button>
        </nav>

        <!-- Main Dynamic App Container -->
        <div id="app-container"></div>

    </div>

    <script>
        // Store uploaded or default data for each line, aligning with real product/model master list
        const appState = {
            press: { name: "Press Machine", data: [], totalPlan: 1200, totalActual: 1250, hours: 8, cycle: 25 },
            back_bottom: { 
                name: "Back plate & Bottom plate", 
                data: [
                    { product: "FUF14", model: "FUF14 D", type: "Back & Bottom (1:1)", plan: 480, ct: 30, actual: 490, hours: 8 },
                    { product: "FUF14", model: "FUF14 L", type: "Back & Bottom (1:1)", plan: 470, ct: 30, actual: 460, hours: 8 },
                    { product: "FUF18", model: "FUF18 D", type: "Back & Bottom (1:1)", plan: 500, ct: 32, actual: 510, hours: 8 },
                    { product: "FUF22", model: "FUF22 S", type: "Back & Bottom (1:1)", plan: 450, ct: 32, actual: 440, hours: 8 }
                ],
                totalPlan: 1900, totalActual: 1900, hours: 8, cycle: 31
            },
            door_a: { 
                name: "Door A", 
                data: [
                    { product: "TD 469", model: "T DOOR H Metal", type: "Door A", plan: 400, ct: 35, actual: 410, hours: 8 },
                    { product: "TD 520", model: "T DOOR 520", type: "Door A", plan: 400, ct: 35, actual: 390, hours: 8 }
                ],
                totalPlan: 800, totalActual: 800, hours: 8, cycle: 35 
            },
            door_b: { 
                name: "Door B", 
                data: [
                    { product: "SBS", model: "SBS 550", type: "Door B", plan: 450, ct: 34, actual: 460, hours: 8 },
                    { product: "SBS", model: "SBS 620", type: "Door B", plan: 400, ct: 34, actual: 400, hours: 8 }
                ],
                totalPlan: 850, totalActual: 860, hours: 8, cycle: 34 
            },
            door_c: { 
                name: "Door C", 
                data: [
                    { product: "BM23", model: "BM23", type: "Door C", plan: 400, ct: 38, actual: 390, hours: 8 },
                    { product: "BM29", model: "BM29", type: "Door C", plan: 350, ct: 38, actual: 340, hours: 8 }
                ],
                totalPlan: 750, totalActual: 730, hours: 8, cycle: 38 
            }
        };

        let currentTab = 'back_bottom';

        function switchTab(tabKey) {
            currentTab = tabKey;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if(btn.getAttribute('data-target') === tabKey) {
                    btn.className = "tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-blue-600 text-white shadow";
                } else {
                    btn.className = "tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-gray-800 text-gray-400 hover:text-white";
                }
            });
            renderView();
        }

        function renderView() {
            const state = appState[currentTab];
            const container = document.getElementById('app-container');

            let tableRows = '';
            if(state.data.length > 0) {
                state.data.forEach(item => {
                    const diff = item.actual - item.plan;
                    const statusBadge = diff >= 0 ? 
                        `<span class="bg-green-950 text-green-400 px-2.5 py-1 rounded text-xs border border-green-800">ผ่านเป้า (+${diff})</span>` : 
                        `<span class="bg-red-950 text-red-400 px-2.5 py-1 rounded text-xs border border-red-800">ต่ำกว่าแผน (${diff})</span>`;
                    
                    tableRows += `
                        <tr class="hover:bg-gray-800/40 transition">
                            <td class="p-4 font-semibold text-white">${item.product}</td>
                            <td class="p-4 text-gray-300">${item.model}</td>
                            <td class="p-4 text-blue-400">${item.type}</td>
                            <td class="p-4 text-right font-bold text-white">${item.plan.toLocaleString()}</td>
                            <td class="p-4 text-right text-gray-300">${item.ct}s</td>
                            <td class="p-4 text-right text-green-400 font-semibold">${item.actual.toLocaleString()}</td>
                            <td class="p-4 text-center">${statusBadge}</td>
                        </tr>
                    `;
                });
            } else {
                tableRows = `<tr><td colspan="7" class="p-6 text-center text-gray-500">ยังไม่มีข้อมูล กรุณาอัปโหลดไฟล์ Excel เพื่อเริ่มต้นใช้งาน</td></tr>`;
            }

            const planPerHour = Math.round(state.totalPlan / state.hours);
            const actualPerHour = Math.round(state.totalActual / state.hours);
            const taktTime = state.totalPlan > 0 ? ((state.hours * 3600) / state.totalPlan).toFixed(1) : 0;
            const maxCap = Math.floor((state.hours * 3600) / state.cycle);

            container.innerHTML = `
                <div class="space-y-6">
                    <!-- Title Bar -->
                    <div class="custom-card p-6 rounded-2xl flex flex-col md:flex-row justify-between items-center border-l-4 border-blue-500 gap-4">
                        <div>
                            <span class="text-xs uppercase tracking-wider text-blue-400 font-semibold">Current Production Line</span>
                            <h2 class="text-2xl font-bold text-white mt-1">${state.name}</h2>
                        </div>
                        <div class="flex items-center gap-3">
                            <input type="file" id="excel-upload" accept=".xlsx, .xls" class="hidden" onchange="handleExcelUpload(event)">
                            <button onclick="document.getElementById('excel-upload').click()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition shadow-md flex items-center gap-2">
                                <span>📁</span> อัปโหลดไฟล์ Excel ยอดผลิต
                            </button>
                        </div>
                    </div>

                    <!-- KPI Cards Summary -->
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="custom-card p-5 rounded-xl">
                            <p class="text-xs text-gray-400 font-medium">ยอดแผนรวม / เฉลี่ยต่อ ชม.</p>
                            <h3 class="text-2xl font-bold text-blue-400 mt-1">${state.totalPlan.toLocaleString()} ชิ้น</h3>
                            <p class="text-xs text-gray-500 mt-1">~ ${planPerHour.toLocaleString()} ชิ้น / ชั่วโมง</p>
                        </div>
                        <div class="custom-card p-5 rounded-xl">
                            <p class="text-xs text-gray-400 font-medium">ยอดผลิตจริง / เฉลี่ยต่อ ชม.</p>
                            <h3 class="text-2xl font-bold text-green-400 mt-1">${state.totalActual.toLocaleString()} ชิ้น</h3>
                            <p class="text-xs text-gray-500 mt-1">~ ${actualPerHour.toLocaleString()} ชิ้น / ชั่วโมง</p>
                        </div>
                        <div class="custom-card p-5 rounded-xl">
                            <p class="text-xs text-gray-400 font-medium">Takt Time คำนวณได้</p>
                            <h3 class="text-2xl font-bold text-yellow-400 mt-1">${taktTime} วินาที</h3>
                            <p class="text-xs text-gray-500 mt-1">ตามเวลาทำงาน ${state.hours} ชม.</p>
                        </div>
                        <div class="custom-card p-5 rounded-xl">
                            <p class="text-xs text-gray-400 font-medium">กำลังผลิตสูงสุด (Max Capacity)</p>
                            <h3 class="text-2xl font-bold text-purple-400 mt-1">${maxCap.toLocaleString()} ชิ้น</h3>
                            <p class="text-xs text-gray-500 mt-1">อ้างอิง Cycle Time เฉลี่ย ${state.cycle}s</p>
                        </div>
                    </div>

                    <!-- Detail Table: Product & Model Breakdown -->
                    <div class="custom-card rounded-xl overflow-hidden shadow-xl">
                        <div class="p-6 border-b border-gray-800 flex justify-between items-center">
                            <h2 class="text-base font-bold text-white">ตารางแสดงยอดผลิตแยกตาม Product ใหญ่ และ Model ย่อย</h2>
                            <span class="text-xs text-gray-400">ข้อมูลนำเข้าจากไฟล์ Excel (อ้างอิงรหัสจริง FUF14, FUF18, FUF22, SBS, BM23, ฯลฯ)</span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-gray-900/50 text-gray-400 text-xs border-b border-gray-800">
                                        <th class="p-4">Product ใหญ่ (Series)</th>
                                        <th class="p-4">Model ย่อย</th>
                                        <th class="p-4">ประเภทชิ้นงาน</th>
                                        <th class="p-4 text-right">ยอดแผน (Plan Pcs)</th>
                                        <th class="p-4 text-right">Cycle Time (s)</th>
                                        <th class="p-4 text-right">ยอดผลิตจริง (Actual Pcs)</th>
                                        <th class="p-4 text-center">สถานะเทียบแผน</th>
                                    </tr>
                                </thead>
                                <tbody class="text-sm divide-y divide-gray-800/60">
                                    ${tableRows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleExcelUpload(event) {
            const file = event.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    if(json.length === 0) {
                        alert('ไม่พบข้อมูลภายในไฟล์ Excel');
                        return;
                    }

                    let parsedData = [];
                    let totalPlan = 0;
                    let totalActual = 0;
                    let totalCt = 0;
                    let hours = 8;

                    json.forEach(row => {
                        const prod = row['Product Group'] || row['Product'] || 'General Product';
                        const model = row['Model Name'] || row['Model'] || 'Model-01';
                        const type = row['Item Type'] || row['Type'] || 'Standard Part';
                        const plan = parseFloat(row['Target Qty (pcs)'] || row['Plan'] || 0);
                        const ct = parseFloat(row['Cycle Time (s)'] || row['Cycle Time'] || 30);
                        const actual = parseFloat(row['Actual Qty (pcs)'] || row['Actual'] || 0);
                        hours = parseFloat(row['Working Hours'] || 8);

                        totalPlan += plan;
                        totalActual += actual;
                        totalCt += ct;

                        parsedData.push({
                            product: prod,
                            model: model,
                            type: type,
                            plan: plan,
                            ct: ct,
                            actual: actual,
                            hours: hours
                        });
                    });

                    const avgCt = parsedData.length > 0 ? Math.round(totalCt / parsedData.length) : 30;

                    appState[currentTab].data = parsedData;
                    appState[currentTab].totalPlan = totalPlan;
                    appState[currentTab].totalActual = totalActual;
                    appState[currentTab].cycle = avgCt;
                    appState[currentTab].hours = hours;

                    renderView();
                    alert('ประมวลผลและอัปโหลดข้อมูลจากไฟล์ Excel สำเร็จ!');
                } catch(error) {
                    console.error(error);
                    alert('เกิดข้อผิดพลาดในการอ่านไฟล์ Excel กรุณาตรวจสอบรูปแบบหัวตาราง');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        window.onload = function() {
            switchTab('back_bottom');
        };
    </script>
</body>
</html>
