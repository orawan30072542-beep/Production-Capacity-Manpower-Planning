<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manpower & Production Capacity Dashboard - Multi-Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #e5e7eb; }
        .custom-card { background-color: #111827; border: 1px solid #1f2937; }
        .input-dark { background-color: #1f2937; border: 1px solid #374151; color: #ffffff; }
        .input-dark:focus { border-color: #3b82f6; outline: none; }
    </style>
</head>
<body class="min-h-screen p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <header class="flex flex-col md:flex-row justify-between items-center custom-card p-6 rounded-2xl shadow-xl">
            <div>
                <div class="flex items-center gap-2">
                    <span class="text-blue-500 text-xl font-bold">⚡</span>
                    <h1 class="text-xl font-bold text-white">Manpower Planning & Production Capacity</h1>
                </div>
                <p class="text-xs text-gray-400 mt-1">ระบบแดชบอร์ดสรุปยอดผลิตและตั้งค่ากระบวนการผลิต</p>
            </div>
            <div class="flex gap-2 text-sm items-center">
                <button onclick="switchMainView('dashboard')" id="nav-btn-dashboard" class="px-4 py-2 rounded-lg font-semibold text-xs transition bg-blue-600 text-white shadow">📊 หน้าหลัก (Dashboard)</button>
                <button onclick="switchMainView('setup')" id="nav-btn-setup" class="px-4 py-2 rounded-lg font-semibold text-xs transition bg-gray-800 text-gray-300 hover:text-white">⚙️ ตั้งค่ากระบวนการและรุ่น</button>
            </div>
        </header>

        <nav class="flex flex-wrap items-center gap-2 custom-card p-3 rounded-xl overflow-x-auto">
            <button onclick="switchTab('press')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-gray-800 text-gray-400 hover:text-white flex items-center gap-2" data-target="press"><span>Press Machine</span></button>
            <button onclick="switchTab('back_bottom')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-blue-600 text-white shadow flex items-center gap-2" data-target="back_bottom"><span>Back Plate & Bottom Plate</span></button>
            <button onclick="switchTab('frame_glass')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-gray-800 text-gray-400 hover:text-white flex items-center gap-2" data-target="frame_glass"><span>Frame & Glass Door</span></button>
            <button onclick="switchTab('door_a')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-gray-800 text-gray-400 hover:text-white flex items-center gap-2" data-target="door_a"><span>Door A</span></button>
            <button onclick="switchTab('door_b')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-gray-800 text-gray-400 hover:text-white flex items-center gap-2" data-target="door_b"><span>Door B</span></button>
            <button onclick="switchTab('door_c')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-gray-800 text-gray-400 hover:text-white flex items-center gap-2" data-target="door_c"><span>Door C</span></button>
            <button onclick="switchTab('gasket')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-gray-800 text-gray-400 hover:text-white flex items-center gap-2" data-target="gasket"><span>Gasket</span></button>
            <button onclick="switchTab('door_in_door')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-gray-800 text-gray-400 hover:text-white flex items-center gap-2" data-target="door_in_door"><span>Door In Door</span></button>
        </nav>

        <div id="sub-filter-bar" class="flex flex-wrap items-center justify-between gap-2 custom-card px-4 py-3 rounded-xl text-sm">
            <div id="filter-buttons-container" class="flex flex-wrap items-center gap-2">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider mr-2">STATION</span>
            </div>
            <button onclick="openFilterEditor()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition border border-gray-700 flex items-center gap-1">
                <span>✏️ จัดการปุ่มหมวดหมู่</span>
            </button>
        </div>

        <div id="app-container"></div>

    </div>

    <div id="filter-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 hidden">
        <div class="custom-card p-6 rounded-2xl w-full max-w-lg space-y-4 shadow-2xl border border-gray-700">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <h3 class="text-base font-bold text-white">แก้ไขปุ่มหมวดหมู่สถานี (Sub Filters)</h3>
                <button onclick="closeFilterEditor()" class="text-gray-400 hover:text-white text-sm">✕</button>
            </div>
            <div id="modal-filter-list" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
            <div class="flex justify-between items-center pt-2 border-t border-gray-800">
                <button onclick="addFilterItem()" class="bg-gray-800 hover:bg-gray-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition border border-gray-700">➕ เพิ่มหมวดหมู่</button>
                <div class="flex gap-2">
                    <button onclick="closeFilterEditor()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-2 rounded-lg text-xs font-semibold">ยกเลิก</button>
                    <button onclick="saveFilterItems()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow">บันทึก</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const appState = {
            press: { name: "Press Machine", productGroup: "Press Panel", workingHours: "8.0", breakTime: "60", taktTime: "45", models: ["159C"], activeModel: "159C", filters: ["All stations", "Press Line 1"], dataByModel: { "159C": [] } },
            back_bottom: { 
                name: "Back Plate & Bottom Plate", 
                productGroup: "Bottom Plate & Back Plate", 
                workingHours: "11.0", 
                breakTime: "60", 
                taktTime: "36.6", 
                models: ["159C", "159F"], 
                activeModel: "159C",
                filters: ["All stations", "Welding", "Back plate", "Bottom plate"], 
                dataByModel: { 
                    "159C": [
                        { station: "BTA01", p1: "ประกอบขา Leg เข้ากับชิ้นส่วน+เคาะ", p2: "ประกอบชิ้นส่วนด้านข้าง", p3: "", wt1: 13.90, wt2: 11.30, wt3: 0, loss: 3.21 },
                        { station: "BTA02", p1: "ประกอบขา Leg เข้ากับชิ้นส่วน+เคาะ", p2: "ประกอบชิ้นส่วนด้านข้าง", p3: "", wt1: 8.80, wt2: 10.20, wt3: 0, loss: 2.54 },
                        { station: "BTA03", p1: "ติดเทปเหนียวด้านข้าง 1 Pcs.", p2: "ติดเทปเหนียวด้านข้าง 1 Pcs.", p3: "ติดเทปเหนียวด้านข้าง 1 Pcs.", wt1: 5.90, wt2: 6.50, wt3: 3.80, loss: 0 }
                    ],
                    "159F": []
                } 
            },
            frame_glass: { name: "Frame & Glass Door", productGroup: "Door Assembly", workingHours: "8.0", breakTime: "60", taktTime: "60", models: ["TD 469"], activeModel: "TD 469", filters: ["All stations", "Frame Assy"], dataByModel: { "TD 469": [] } },
            door_a: { name: "Door A", productGroup: "Refrigerator Door A", workingHours: "8.0", breakTime: "60", taktTime: "50", models: ["TD 469"], activeModel: "TD 469", filters: ["All stations", "Main Line"], dataByModel: { "TD 469": [] } },
            door_b: { name: "Door B", productGroup: "Refrigerator Door B", workingHours: "8.0", breakTime: "60", taktTime: "55", models: ["SBS 550"], activeModel: "SBS 550", filters: ["All stations", "Main Line"], dataByModel: { "SBS 550": [] } },
            door_c: { name: "Door C", productGroup: "Refrigerator Door C", workingHours: "8.0", breakTime: "60", taktTime: "50", models: ["BM23"], activeModel: "BM23", filters: ["All stations", "Main Line"], dataByModel: { "BM23": [] } },
            gasket: { name: "Gasket", productGroup: "Gasket Profile", workingHours: "8.0", breakTime: "60", taktTime: "40", models: ["Gasket Standard"], activeModel: "Gasket Standard", filters: ["All stations", "Cutting"], dataByModel: { "Gasket Standard": [] } },
            door_in_door: { name: "Door In Door", productGroup: "DID Assembly", workingHours: "8.0", breakTime: "60", taktTime: "65", models: ["DID Model"], activeModel: "DID Model", filters: ["All stations", "Assembly"], dataByModel: { "DID Model": [] } }
        };

        let currentTab = 'back_bottom';
        let currentMainView = 'dashboard';
        let activeFilter = 'All stations';
        let tempFilters = [];

        function switchMainView(view) {
            currentMainView = view;
            if(view === 'dashboard') {
                document.getElementById('nav-btn-dashboard').className = "px-4 py-2 rounded-lg font-semibold text-xs transition bg-blue-600 text-white shadow";
                document.getElementById('nav-btn-setup').className = "px-4 py-2 rounded-lg font-semibold text-xs transition bg-gray-800 text-gray-300 hover:text-white";
                document.getElementById('sub-filter-bar').style.display = 'flex';
            } else {
                document.getElementById('nav-btn-setup').className = "px-4 py-2 rounded-lg font-semibold text-xs transition bg-blue-600 text-white shadow";
                document.getElementById('nav-btn-dashboard').className = "px-4 py-2 rounded-lg font-semibold text-xs transition bg-gray-800 text-gray-300 hover:text-white";
                document.getElementById('sub-filter-bar').style.display = 'none';
            }
            renderView();
        }

        function switchTab(tabKey) {
            currentTab = tabKey;
            activeFilter = 'All stations';
            const state = appState[currentTab];
            if(!state.models.includes(state.activeModel)) {
                state.activeModel = state.models[0] || '';
            }
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if(btn.getAttribute('data-target') === tabKey) {
                    btn.className = "tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-blue-600 text-white shadow flex items-center gap-2";
                } else {
                    btn.className = "tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-gray-800 text-gray-400 hover:text-white flex items-center gap-2";
                }
            });
            renderFilters();
            renderView();
        }

        function renderFilters() {
            const state = appState[currentTab];
            const container = document.getElementById('filter-buttons-container');
            let html = '<span class="text-xs font-bold text-gray-400 uppercase tracking-wider mr-2">STATION</span>';
            
            if(state.filters && state.filters.length > 0) {
                state.filters.forEach(f => {
                    const isActive = (activeFilter === f);
                    const btnClass = isActive 
                        ? "px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white shadow flex items-center gap-1.5"
                        : "px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-gray-900 text-gray-300 border border-gray-800 hover:bg-gray-800 flex items-center gap-1.5";
                    html += `<button onclick="selectFilter('${f}')" class="${btnClass}"><span>${f}</span></button>`;
                });
            }
            container.innerHTML = html;
        }

        function selectFilter(fName) {
            activeFilter = fName;
            renderFilters();
        }

        function openFilterEditor() {
            const state = appState[currentTab];
            tempFilters = [...state.filters];
            renderModalFilterList();
            document.getElementById('filter-modal').classList.remove('hidden');
        }

        function closeFilterEditor() {
            document.getElementById('filter-modal').classList.add('hidden');
        }

        function renderModalFilterList() {
            const container = document.getElementById('modal-filter-list');
            let html = '';
            tempFilters.forEach((f, idx) => {
                html += `
                    <div class="flex items-center gap-2">
                        <input type="text" value="${f}" onchange="updateTempFilter(${idx}, this.value)" class="input-dark px-3 py-1.5 rounded-lg text-xs w-full">
                        <button onclick="removeTempFilter(${idx})" class="bg-red-950 text-red-400 border border-red-800 px-3 py-1.5 rounded-lg text-xs">ลบ</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function updateTempFilter(idx, val) { tempFilters[idx] = val; }
        function addFilterItem() { tempFilters.push("หมวดหมู่ใหม่"); renderModalFilterList(); }
        function removeTempFilter(idx) { tempFilters.splice(idx, 1); renderModalFilterList(); }
        function saveFilterItems() {
            appState[currentTab].filters = [...tempFilters];
            if(!appState[currentTab].filters.includes(activeFilter)) {
                activeFilter = appState[currentTab].filters[0] || 'All stations';
            }
            renderFilters();
            closeFilterEditor();
        }

        function renderView() {
            const state = appState[currentTab];
            const container = document.getElementById('app-container');

            if(currentMainView === 'dashboard') {
                let modelBadgesSmall = '';
                if(state.models && state.models.length > 0) {
                    state.models.forEach(m => {
                        modelBadgesSmall += `<span class="bg-gray-800/80 text-yellow-400/90 border border-gray-700/60 px-2.5 py-1 rounded-md text-xs font-medium">${m}</span>`;
                    });
                } else {
                    modelBadgesSmall = `<span class="text-gray-500 text-xs">ยังไม่ได้เลือกรุ่น</span>`;
                }

                if (!state.dataByModel) state.dataByModel = {};
                if (!state.dataByModel[state.activeModel]) state.dataByModel[state.activeModel] = [];
                const activeModelData = state.dataByModel[state.activeModel];

                let dashboardRows = '';
                activeModelData.forEach((item) => {
                    const wtTotal = (Number(item.wt1)||0) + (Number(item.wt2)||0) + (Number(item.wt3)||0);
                    const cycleTime = wtTotal + (Number(item.loss)||0);
                    dashboardRows += `
                        <tr class="hover:bg-gray-800/40 transition">
                            <td class="p-3 font-semibold text-white">${item.station || '-'}</td>
                            <td class="p-3 text-gray-300">${item.p1 || '-'}</td>
                            <td class="p-3 text-gray-300">${item.p2 || '-'}</td>
                            <td class="p-3 text-gray-300">${item.p3 || '-'}</td>
                            <td class="p-3 text-center text-gray-300">${item.wt1 || '-'}</td>
                            <td class="p-3 text-center text-gray-300">${item.wt2 || '-'}</td>
                            <td class="p-3 text-center text-gray-300">${item.wt3 || '-'}</td>
                            <td class="p-3 text-center font-bold text-white">${wtTotal > 0 ? wtTotal.toFixed(2) : '-'}</td>
                            <td class="p-3 text-center text-red-400">${item.loss ? Number(item.loss).toFixed(2) : '-'}</td>
                            <td class="p-3 text-center font-bold text-yellow-400">${cycleTime > 0 ? cycleTime.toFixed(2) : '-'}</td>
                        </tr>
                    `;
                });

                // จำลองตาราง Order & Capacity Matrix รายวันตามภาพตัวอย่าง
                const dates = ["20 ส.ค.", "21 ส.ค.", "22 ส.ค.", "23 ส.ค.", "24 ส.ค.", "25 ส.ค.", "26 ส.ค.", "27 ส.ค.", "28 ส.ค.", "29 ส.ค.", "30 ส.ค.", "31 ส.ค.", "1 ก.ย.", "2 ก.ย.", "3 ก.ย.", "4 ก.ย.", "5 ก.ย."];
                let dateHeaderHtml = '';
                let wtHeaderHtml = '';
                let shiftHeaderHtml = '';
                let effHeaderHtml = '';
                let lineARows = '';
                let lineBRows = '';

                dates.forEach((d, idx) => {
                    dateHeaderHtml += `<th class="p-2 text-center border border-gray-800 text-[11px] bg-gray-900">${d}</th>`;
                    wtHeaderHtml += `<td class="p-2 text-center border border-gray-800 text-xs">11</td>`;
                    shiftHeaderHtml += `<td class="p-2 text-center border border-gray-800 text-xs">2</td>`;
                    effHeaderHtml += `<td class="p-2 text-center border border-gray-800 text-xs">100</td>`;
                    
                    const baseValA = 2000 + (idx * 50);
                    const baseValB = 2700 + (idx * 30);
                    lineARows += `<td class="p-2 text-center border border-gray-800 text-xs"><div class="font-bold text-white">${baseValA}</div><div class="text-[10px] text-blue-400">94</div></td>`;
                    lineBRows += `<td class="p-2 text-center border border-gray-800 text-xs"><div class="font-bold text-white">${baseValB}</div><div class="text-[10px] text-blue-400">125</div></td>`;
                });

                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="custom-card p-6 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4 border-l-4 border-blue-500">
                            <div>
                                <span class="text-xs uppercase tracking-wider text-blue-400 font-semibold">Production Line Overview</span>
                                <h2 class="text-2xl font-bold text-white mt-1">${state.name} <span class="text-xs text-blue-400 bg-blue-950/60 px-2.5 py-1 rounded-full border border-blue-800/60 ml-2">แสดงผลรุ่น: ${state.activeModel || '-'}</span></h2>
                            </div>
                            <button onclick="switchMainView('setup')" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg text-xs font-semibold transition border border-gray-700 flex items-center gap-1.5">
                                <span>⚙️</span> ไปหน้าตั้งค่ากระบวนการ
                            </button>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="custom-card p-6 rounded-2xl space-y-4 flex flex-col justify-between">
                                <div>
                                    <p class="text-xs text-gray-400 font-medium">Product ใหญ่ (Product Group)</p>
                                    <div class="mt-2">
                                        <span class="bg-blue-950/80 text-blue-300 border border-blue-800 px-3.5 py-1.5 rounded-xl text-base font-bold inline-block shadow-inner">${state.productGroup || '-'}</span>
                                    </div>
                                </div>
                                <div class="pt-3 border-t border-gray-800/80 space-y-2">
                                    <p class="text-xs text-gray-400 font-medium">รุ่นที่ผลิต (Models)</p>
                                    <div class="flex flex-wrap gap-1.5">${modelBadgesSmall}</div>
                                </div>
                            </div>

                            <div class="custom-card p-6 rounded-2xl space-y-3">
                                <p class="text-xs text-gray-400 font-medium">เวลาการทำงานและผลิต (Time Metrics)</p>
                                <div class="flex justify-between items-center pt-1">
                                    <span class="text-xs text-gray-300">เวลาทำงาน/วัน:</span>
                                    <span class="text-sm font-bold text-white">${state.workingHours || '8.0'} ชม.</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-xs text-gray-300">เวลาพัก:</span>
                                    <span class="text-sm font-bold text-white">${state.breakTime || '60'} นาที</span>
                                </div>
                                <div class="flex justify-between items-center border-t border-gray-800 pt-2">
                                    <span class="text-xs text-gray-300">Takt Time:</span>
                                    <span class="text-sm font-bold text-yellow-400">${state.taktTime || '-'} วินาที</span>
                                </div>
                            </div>

                            <div class="custom-card p-6 rounded-2xl space-y-2 flex flex-col justify-between">
                                <p class="text-xs text-gray-400 font-medium">จำนวนพนักงาน (Manpower)</p>
                                <div class="flex items-baseline gap-2 pt-2">
                                    <span class="text-xl font-bold text-blue-400">จัดสรรครบถ้วนตามสถานี</span>
                                </div>
                                <p class="text-xs text-gray-500">อ้างอิงจากรุ่น ${state.activeModel} (${activeModelData.length} สถานี)</p>
                            </div>
                        </div>

                        <div class="custom-card rounded-xl overflow-hidden shadow-xl">
                            <div class="p-6 border-b border-gray-800 flex justify-between items-center">
                                <h3 class="text-base font-bold text-white">ตารางสรุปกระบวนการและเวลาการทำงาน</h3>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-gray-900/50 text-gray-400 text-xs border-b border-gray-800">
                                            <th class="p-3">Station</th>
                                            <th class="p-3">Process 1</th>
                                            <th class="p-3">Process 2</th>
                                            <th class="p-3">Process 3</th>
                                            <th class="p-3 text-center">WT 1</th>
                                            <th class="p-3 text-center">WT 2</th>
                                            <th class="p-3 text-center">WT 3</th>
                                            <th class="p-3 text-center">WT Total</th>
                                            <th class="p-3 text-center">Loss</th>
                                            <th class="p-3 text-center">Cycle Time</th>
                                        </tr>
                                    </thead>
                                    <tbody class="text-sm divide-y divide-gray-800/60">
                                        ${dashboardRows}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="custom-card rounded-xl overflow-hidden shadow-xl">
                            <div class="p-6 border-b border-gray-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <h3 class="text-base font-bold text-white">สรุปยอดผลิตรายวัน — ตาม Sub-line</h3>
                                    <p class="text-xs text-gray-400 mt-0.5">แยกยอดตามไลน์ย่อยของ "${state.name}" ตามการเลือก Sub-line ในตาราง Order & Capacity</p>
                                </div>
                                <div class="flex items-center gap-3 bg-gray-900 px-4 py-2 rounded-xl border border-gray-800 text-xs">
                                    <div>WT (ชม./กะ): <span class="font-bold text-blue-400">11</span></div>
                                    <div>×</div>
                                    <div>กะ (Shift): <span class="font-bold text-blue-400">2</span></div>
                                    <div>×</div>
                                    <div>Efficiency (%): <span class="font-bold text-blue-400">100</span></div>
                                    <div>= <span class="font-bold text-yellow-400 text-sm">22.0 ชม./วัน</span></div>
                                </div>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full border-collapse border border-gray-800">
                                    <thead>
                                        <tr class="bg-gray-900 text-gray-300 text-xs">
                                            <th class="p-2 border border-gray-800 text-left min-w-[160px]">วันที่</th>
                                            ${dateHeaderHtml}
                                        </tr>
                                    </thead>
                                    <tbody class="text-xs">
                                        <tr class="hover:bg-gray-800/30">
                                            <td class="p-2 border border-gray-800 font-semibold text-gray-300 bg-gray-900/40">WT (ชม./กะ)</td>
                                            ${wtHeaderHtml}
                                        </tr>
                                        <tr class="hover:bg-gray-800/30">
                                            <td class="p-2 border border-gray-800 font-semibold text-gray-300 bg-gray-900/40">กะ (Shift)</td>
                                            ${shiftHeaderHtml}
                                        </tr>
                                        <tr class="hover:bg-gray-800/30 border-b-2 border-gray-700">
                                            <td class="p-2 border border-gray-800 font-semibold text-gray-300 bg-gray-900/40">Efficiency (%)</td>
                                            ${effHeaderHtml}
                                        </tr>
                                        <tr class="hover:bg-gray-800/30">
                                            <td class="p-2 border border-gray-800 font-bold text-blue-400 bg-gray-900/40">Order Back plate #A</td>
                                            ${lineARows}
                                        </tr>
                                        <tr class="hover:bg-gray-800/30">
                                            <td class="p-2 border border-gray-800 font-bold text-blue-400 bg-gray-900/40">Order Back plate #B</td>
                                            ${lineBRows}
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                    </div>
                `;
            } else {
                if (!state.dataByModel) state.dataByModel = {};
                if (!state.dataByModel[state.activeModel]) state.dataByModel[state.activeModel] = [];
                const activeModelData = state.dataByModel[state.activeModel];
                
                let setupRows = '';
                activeModelData.forEach((item, index) => {
                    setupRows += `
                        <tr class="hover:bg-gray-800/40 transition">
                            <td class="p-3 font-semibold text-white"><input type="text" value="${item.station || ''}" onchange="updateSetupRow(${index}, 'station', this.value)" class="input-dark px-2 py-1 rounded text-xs w-20"></td>
                            <td class="p-3"><input type="text" value="${item.p1 || ''}" onchange="updateSetupRow(${index}, 'p1', this.value)" class="input-dark px-2 py-1 rounded text-xs w-full" placeholder="Process 1"></td>
                            <td class="p-3"><input type="text" value="${item.p2 || ''}" onchange="updateSetupRow(${index}, 'p2', this.value)" class="input-dark px-2 py-1 rounded text-xs w-full" placeholder="Process 2"></td>
                            <td class="p-3"><input type="text" value="${item.p3 || ''}" onchange="updateSetupRow(${index}, 'p3', this.value)" class="input-dark px-2 py-1 rounded text-xs w-full" placeholder="Process 3"></td>
                            <td class="p-3"><input type="number" step="0.01" value="${item.wt1 !== undefined ? item.wt1 : 0}" onchange="updateSetupRow(${index}, 'wt1', this.value)" class="input-dark px-2 py-1 rounded text-xs w-20 text-center"></td>
                            <td class="p-3"><input type="number" step="0.01" value="${item.wt2 !== undefined ? item.wt2 : 0}" onchange="updateSetupRow(${index}, 'wt2', this.value)" class="input-dark px-2 py-1 rounded text-xs w-20 text-center"></td>
                            <td class="p-3"><input type="number" step="0.01" value="${item.wt3 !== undefined ? item.wt3 : 0}" onchange="updateSetupRow(${index}, 'wt3', this.value)" class="input-dark px-2 py-1 rounded text-xs w-20 text-center"></td>
                            <td class="p-3"><input type="number" step="0.01" value="${item.loss !== undefined ? item.loss : 0}" onchange="updateSetupRow(${index}, 'loss', this.value)" class="input-dark px-2 py-1 rounded text-xs w-20 text-center"></td>
                            <td class="p-3 text-center"><button onclick="removeStation(${index})" class="bg-red-950 text-red-400 border border-red-800 px-2.5 py-1 rounded text-xs">ลบ</button></td>
                        </tr>
                    `;
                });

                const allModelsList = ["159C", "159F", "199C", "199F", "TM545#212", "FUF14D", "FUF18D", "FUF22S", "TD 469", "SBS 550", "BM23", "Gasket Standard", "DID Model"];
                let modelCheckboxes = '';
                allModelsList.forEach(m => {
                    const checked = state.models && state.models.includes(m) ? 'checked' : '';
                    modelCheckboxes += `
                        <label class="flex items-center gap-2 bg-gray-900 border border-gray-800 px-3 py-2 rounded-lg cursor-pointer text-xs">
                            <input type="checkbox" value="${m}" ${checked} onchange="toggleModel('${m}')" class="rounded bg-gray-800 border-gray-700 text-blue-600">
                            <span class="text-white">${m}</span>
                        </label>
                    `;
                });

                let modelTabsForSetup = '';
                if(state.models) {
                    state.models.forEach(m => {
                        const isActive = (state.activeModel === m);
                        const btnClass = isActive 
                            ? "px-3.5 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white shadow"
                            : "px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-gray-900 text-gray-300 border border-gray-800 hover:bg-gray-800";
                        modelTabsForSetup += `<button onclick="setActiveModelForSetup('${m}')" class="${btnClass}">${m}</button>`;
                    });
                }

                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="custom-card p-6 rounded-2xl flex flex-col md:flex-row justify-between items-center border-l-4 border-yellow-500 gap-4">
                            <div>
                                <span class="text-xs uppercase tracking-wider text-yellow-400 font-semibold">Setup & Configuration</span>
                                <h2 class="text-2xl font-bold text-white mt-1">ตั้งค่ากระบวนการและเลือกรุ่น สำหรับ ${state.name}</h2>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="addStation()" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2.5 rounded-lg text-xs font-semibold transition border border-gray-700">➕ เพิ่มสถานี</button>
                                <button onclick="switchMainView('dashboard')" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition shadow-md">💾 บันทึกและกลับหน้าหลัก</button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div class="custom-card p-6 rounded-xl space-y-2">
                                <h3 class="text-sm font-bold text-white">Product ใหญ่ (Product Group)</h3>
                                <p class="text-xs text-gray-400">ระบุชื่อผลิตภัณฑ์หลัก</p>
                                <input type="text" value="${state.productGroup || ''}" onchange="updateProductGroup(this.value)" class="input-dark px-4 py-2 rounded-lg text-sm w-full font-semibold text-blue-400 mt-1" placeholder="เช่น Bottom Plate">
                            </div>
                            <div class="custom-card p-6 rounded-xl space-y-2">
                                <h3 class="text-sm font-bold text-white">⏱️ เวลาการทำงาน (Working Time)</h3>
                                <div class="grid grid-cols-2 gap-2 mt-1">
                                    <div>
                                        <label class="text-[10px] text-gray-400">เวลาทำงาน (ชม./วัน)</label>
                                        <input type="number" step="0.5" value="${state.workingHours || '8.0'}" onchange="updateWorkingTime('workingHours', this.value)" class="input-dark px-3 py-2 rounded-lg text-sm w-full font-semibold text-white">
                                    </div>
                                    <div>
                                        <label class="text-[10px] text-gray-400">เวลาพัก (นาที)</label>
                                        <input type="number" value="${state.breakTime || '60'}" onchange="updateWorkingTime('breakTime', this.value)" class="input-dark px-3 py-2 rounded-lg text-sm w-full font-semibold text-white">
                                    </div>
                                </div>
                            </div>
                            <div class="custom-card p-6 rounded-xl space-y-2">
                                <h3 class="text-sm font-bold text-white">⚡ Takt Time / เป้าหมาย</h3>
                                <p class="text-xs text-gray-400">กำหนดรอบเวลามาตรฐาน (วินาที)</p>
                                <input type="number" step="0.1" value="${state.taktTime || ''}" onchange="updateWorkingTime('taktTime', this.value)" class="input-dark px-4 py-2 rounded-lg text-sm w-full font-bold text-yellow-400 mt-1" placeholder="เช่น 36.6">
                            </div>
                        </div>

                        <div class="custom-card p-6 rounded-xl space-y-3">
                            <h3 class="text-sm font-bold text-white">เลือกรุ่น (Models) ที่ใช้ในกระบวนการนี้</h3>
                            <div class="grid grid-cols-2 md:grid-cols-5 gap-3">${modelCheckboxes}</div>
                        </div>

                        <div class="custom-card rounded-xl overflow-hidden shadow-xl">
                            <div class="p-6 border-b border-gray-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                                <h3 class="text-base font-bold text-white">ตารางจัดการสถานีและเวลาการทำงาน (WT1, WT2, WT3, Loss)</h3>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="text-xs text-gray-400">เลือกรุ่นเพื่อแก้ไขข้อมูล:</span>
                                    <div class="flex gap-1.5 flex-wrap">${modelTabsForSetup}</div>
                                </div>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-gray-900/50 text-gray-400 text-xs border-b border-gray-800">
                                            <th class="p-3">Station</th>
                                            <th class="p-3">Process 1</th>
                                            <th class="p-3">Process 2</th>
                                            <th class="p-3">Process 3</th>
                                            <th class="p-3 text-center">WT 1</th>
                                            <th class="p-3 text-center">WT 2</th>
                                            <th class="p-3 text-center">WT 3</th>
                                            <th class="p-3 text-center">Loss</th>
                                            <th class="p-3 text-center">จัดการ</th>
                                        </tr>
                                    </thead>
                                    <tbody class="text-sm divide-y divide-gray-800/60">
                                        ${setupRows}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function updateSetupRow(index, field, value) {
            const state = appState[currentTab];
            const activeList = state.dataByModel[state.activeModel];
            if(['wt1', 'wt2', 'wt3', 'loss'].includes(field)) {
                activeList[index][field] = value === "" ? 0 : parseFloat(value);
            } else {
                activeList[index][field] = value;
            }
        }

        function updateProductGroup(val) { appState[currentTab].productGroup = val; }
        function updateWorkingTime(field, val) { appState[currentTab][field] = val; }

        function addStation() {
            if (typeof appState === 'undefined' || !currentTab) return;
            
            const state = appState[currentTab];
            if (!state) return;
            
            if (!state.models || !Array.isArray(state.models) || state.models.length === 0) {
                state.models = ["Default Model"];
            }
            
            if (!state.activeModel || !state.models.includes(state.activeModel)) {
                state.activeModel = state.models[0];
            }
            
            if (!state.dataByModel || typeof state.dataByModel !== 'object') {
                state.dataByModel = {};
            }
            
            if (!state.dataByModel[state.activeModel] || !Array.isArray(state.dataByModel[state.activeModel])) {
                state.dataByModel[state.activeModel] = [];
            }
            
            const activeList = state.dataByModel[state.activeModel];
            const stName = "BTA0" + (activeList.length + 1);
            
            activeList.push({ 
                station: stName, 
                p1: "", 
                p2: "", 
                p3: "", 
                wt1: 0, 
                wt2: 0, 
                wt3: 0, 
                loss: 0 
            });
            
            renderView();
        }

        function removeStation(index) {
            const state = appState[currentTab];
            if (state && state.dataByModel && state.dataByModel[state.activeModel]) {
                state.dataByModel[state.activeModel].splice(index, 1);
                renderView();
            }
        }

        function toggleModel(modelName) {
            const state = appState[currentTab];
            if (!state.models) state.models = [];
            const models = state.models;
            const idx = models.indexOf(modelName);
            
            if(idx > -1) { 
                models.splice(idx, 1); 
                if (state.dataByModel) delete state.dataByModel[modelName];
                if(state.activeModel === modelName) {
                    state.activeModel = models[0] || '';
                }
            } else { 
                models.push(modelName); 
                if(!state.dataByModel) state.dataByModel = {};
                if(!state.dataByModel[modelName]) {
                    state.dataByModel[modelName] = [];
                }
                if(!state.activeModel) {
                    state.activeModel = modelName;
                }
            }
            renderView();
        }

        function setActiveModelForSetup(modelName) {
            appState[currentTab].activeModel = modelName;
            renderView();
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const processParam = urlParams.get('process');
            
            if (processParam) {
                const foundKey = Object.keys(appState).find(key => 
                    appState[key].name.toLowerCase() === processParam.toLowerCase() || key.toLowerCase() === processParam.toLowerCase()
                );
                
                if (foundKey) {
                    currentTab = foundKey;
                }
            }
            
            renderFilters();
            switchTab(currentTab);
        };
    </script>
</body>
</html>
