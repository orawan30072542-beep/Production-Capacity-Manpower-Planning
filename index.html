    </div>

        function switchMainView(view) {
            currentMainView = view;
            if(view === 'dashboard') {
                document.getElementById('nav-btn-dashboard').className = "px-4 py-2 rounded-lg font-semibold text-xs transition bg-blue-600 text-white shadow";
                document.getElementById('nav-btn-setup').className = "px-4 py-2 rounded-lg font-semibold text-xs transition bg-gray-800 text-gray-300 hover:text-white";
                document.getElementById('sub-filter-bar').style.display = 'flex';
            } else {
                document.getElementById('nav-btn-setup').className = "px-4 py-2 rounded-lg font-semibold text-xs transition bg-blue-600 text-white shadow";
                document.getElementById('nav-btn-dashboard').className = "px-4 py-2 rounded-lg font-semibold text-xs transition bg-gray-800 text-gray-300 hover:text-white";
                document.getElementById('sub-filter-bar').style.display = 'none';
            }
            renderView();
        }

        function switchTab(tabKey) {
            currentTab = tabKey;
            activeFilter = 'All stations';
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if(btn.getAttribute('data-target') === tabKey) {
                    btn.className = "tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-blue-600 text-white shadow flex items-center gap-2";
                } else {
                    btn.className = "tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-gray-800 text-gray-400 hover:text-white flex items-center gap-2";
                }
            });
            renderFilters();
            renderView();
        }

        function renderFilters() {
            const state = appState[currentTab];
            const container = document.getElementById('filter-buttons-container');
            let html = '<span class="text-xs font-bold text-gray-400 uppercase tracking-wider mr-2">STATION</span>';
            
            if(state.filters && state.filters.length > 0) {
                state.filters.forEach(f => {
                    const isActive = (activeFilter === f);
                    const btnClass = isActive 
                        ? "px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white shadow flex items-center gap-1.5"
                        : "px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-gray-900 text-gray-300 border border-gray-800 hover:bg-gray-800 flex items-center gap-1.5";
                    html += `<button onclick="selectFilter('${f}')" class="${btnClass}"><span>${f}</span></button>`;
                });
            }
            container.innerHTML = html;
        }

        function selectFilter(fName) {
            activeFilter = fName;
            renderFilters();
        }

        function openFilterEditor() {
            const state = appState[currentTab];
            tempFilters = [...state.filters];
            renderModalFilterList();
            document.getElementById('filter-modal').classList.remove('hidden');
        }

        function closeFilterEditor() {
            document.getElementById('filter-modal').classList.add('hidden');
        }

        function renderModalFilterList() {
            const container = document.getElementById('modal-filter-list');
            let html = '';
            tempFilters.forEach((f, idx) => {
                html += `
                    <div class="flex items-center gap-2">
                        <input type="text" value="${f}" onchange="updateTempFilter(${idx}, this.value)" class="input-dark px-3 py-1.5 rounded-lg text-xs w-full">
                        <button onclick="removeTempFilter(${idx})" class="bg-red-950 text-red-400 border border-red-800 px-3 py-1.5 rounded-lg text-xs">ลบ</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function updateTempFilter(idx, val) {
            tempFilters[idx] = val;
        }

        function addFilterItem() {
            tempFilters.push("หมวดหมู่ใหม่");
            renderModalFilterList();
        }

        function removeTempFilter(idx) {
            tempFilters.splice(idx, 1);
            renderModalFilterList();
        }
